model_list:
  - model_name: light-luna
    litellm_params:
      model: github_copilot/responses/gpt-6-luna
      tags:
        - profile:personal
        - tier:light
        - capability:coding
        - capability:analysis
        - capability:tools
    model_info:
      mode: responses
  - model_name: personal-light-zen
    litellm_params:
      model: openai/deepseek-v4-flash
      api_base: https://opencode.ai/zen/v1
      api_key: os.environ/OPENCODE_ZEN_API_KEY
      tags:
        - profile:personal
        - tier:light
        - capability:coding
        - capability:analysis
        - capability:tools
        - fallback:zen
  - model_name: light-haiku
    litellm_params:
      model: github_copilot/claude-haiku-5.5
      tags:
        - profile:personal
        - tier:light
        - capability:coding
        - capability:analysis
        - capability:tools
  - model_name: standard-terra
    litellm_params:
      model: github_copilot/responses/gpt-6-terra
      tags:
        - profile:personal
        - tier:standard
        - capability:coding
        - capability:analysis
        - capability:tools
    model_info:
      mode: responses
  - model_name: standard-sonnet
    litellm_params:
      model: github_copilot/claude-sonnet-5.5
      tags:
        - profile:personal
        - tier:standard
        - capability:coding
        - capability:analysis
        - capability:tools
  - model_name: premium-sol
    litellm_params:
      model: github_copilot/responses/gpt-6-sol
      tags:
        - profile:personal
        - tier:premium
        - capability:coding
        - capability:analysis
        - capability:tools
        - capability:large-context
    model_info:
      mode: responses
  - model_name: premium-opus
    litellm_params:
      model: github_copilot/claude-opus-5.5
      tags:
        - profile:personal
        - tier:premium
        - capability:coding
        - capability:analysis
        - capability:tools
        - capability:large-context

router_settings:
  enable_tag_filtering: true
  tag_filtering_match_any: false
  tag_routing_prefix: "route:"
  fallbacks:
    - light-luna:
        - personal-light-zen
  retry_policy:
    RateLimitErrorRetries: 0
    DefaultRetries: 0

general_settings:
  master_key: os.environ/OPENCODE_ROUTER_KEY
  enforce_fallback_model_access: false

litellm_settings:
  turn_off_message_logging: true
  disable_spend_logs: true
  drop_params: true
